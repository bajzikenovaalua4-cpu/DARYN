<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Law Quest KZ</title>
  <style>
    :root {
      --bg: #eef3f8;
      --ink: #172033;
      --muted: #617086;
      --card: #ffffff;
      --line: #d9e2ef;
      --blue: #2563eb;
      --green: #0f8a5f;
      --red: #c2410c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      background: var(--blue);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { filter: brightness(0.95); }
    button.secondary { background: #334155; }

    .screen {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0;
    }

    .menu {
      min-height: 100vh;
      display: grid;
      align-content: center;
      gap: 28px;
    }

    .hero {
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 20px 55px rgba(15, 23, 42, 0.09);
    }

    .hero p { max-width: 720px; color: var(--muted); font-size: 20px; line-height: 1.55; }
    .eyebrow { color: var(--green); font-weight: 900; text-transform: uppercase; font-size: 13px; }
    h1 { margin: 10px 0 12px; font-size: clamp(44px, 8vw, 82px); line-height: 0.95; }
    h2 { margin: 0 0 10px; }

    .locations {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .location-card {
      min-height: 220px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      text-align: left;
      color: var(--ink);
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.07);
    }

    .location-card span { font-size: 40px; }
    .location-card p { color: var(--muted); line-height: 1.45; }

    .game-ui {
      display: none;
      min-height: 100vh;
      padding: 18px;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 auto 12px;
      max-width: 1000px;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 800;
    }

    .pill {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }

    canvas {
      display: block;
      width: min(100%, 1000px);
      height: auto;
      margin: 0 auto;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #e8f0e7;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
    }

    .hint {
      max-width: 1000px;
      margin: 12px auto 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.54);
    }

    .modal {
      width: min(720px, 100%);
      max-height: 92vh;
      overflow: auto;
      padding: 24px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.28);
    }

    .modal p { color: var(--muted); line-height: 1.55; }
    .answers { display: grid; gap: 10px; margin-top: 16px; }
    .answer { width: 100%; text-align: left; background: #eef4ff; color: var(--ink); }
    .feedback { display: none; margin-top: 16px; padding: 16px; border-radius: 8px; line-height: 1.5; }
    .feedback.good { display: block; border: 1px solid #bbf7d0; background: #f0fdf4; color: #166534; }
    .feedback.bad { display: block; border: 1px solid #fed7aa; background: #fff7ed; color: #9a3412; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

    @media (max-width: 760px) {
      .locations { grid-template-columns: 1fr; }
      .hero { padding: 24px; }
      .hud { align-items: stretch; flex-direction: column; }
      .hud button { width: 100%; }
    }
  </style>
</head>
<body>
  <main id="menu" class="screen menu">
    <section class="hero">
      <div class="eyebrow">2D-квест по законам Республики Казахстан</div>
      <h1>Law Quest KZ</h1>
      <p>
        Выбери локацию, подойди к персонажу и нажми E. Отвечай на бытовые юридические ситуации,
        зарабатывай XP и учись защищать свои права.
      </p>
    </section>

    <section class="locations">
      <button class="location-card" data-location="school">
        <span>🎓</span>
        <h2>Школа</h2>
        <p>Буллинг, личные вещи, права школьника и уважительное отношение.</p>
      </button>
      <button class="location-card" data-location="work">
        <span>💼</span>
        <h2>Работа</h2>
        <p>Зарплата, сверхурочные, испытательный срок и трудовые гарантии.</p>
      </button>
      <button class="location-card" data-location="car">
        <span>🚗</span>
        <h2>Вождение машины</h2>
        <p>Остановка ДПС, досмотр автомобиля, штрафы и спокойный диалог.</p>
      </button>
    </section>
  </main>

  <section id="gameUi" class="game-ui">
    <div class="hud">
      <div class="stats">
        <span id="locationName" class="pill">Локация</span>
        <span id="xpView" class="pill">XP: 0</span>
        <span id="solvedView" class="pill">Решено: 0/3</span>
      </div>
      <button id="backToMenu" class="secondary">Вернуться в меню</button>
    </div>
    <canvas id="game" width="1000" height="620"></canvas>
    <p class="hint">WASD — движение, E — поговорить. Русская раскладка тоже работает: ЦФЫВ.</p>
  </section>

  <div id="modalBackdrop" class="modal-backdrop">
    <article class="modal">
      <div class="eyebrow" id="npcName">Ситуация</div>
      <h2 id="caseTitle"></h2>
      <p id="caseText"></p>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback"></div>
      <div class="modal-actions">
        <button id="continueGame">Продолжить</button>
        <button id="modalMenu" class="secondary">В меню</button>
      </div>
    </article>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const gameUi = document.getElementById('gameUi');
    const locationName = document.getElementById('locationName');
    const xpView = document.getElementById('xpView');
    const solvedView = document.getElementById('solvedView');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const npcName = document.getElementById('npcName');
    const caseTitle = document.getElementById('caseTitle');
    const caseText = document.getElementById('caseText');
    const answers = document.getElementById('answers');
    const feedback = document.getElementById('feedback');

    const keys = { w: false, a: false, s: false, d: false };
    const keyMap = { w: 'w', a: 'a', s: 's', d: 'd', ц: 'w', ф: 'a', ы: 's', в: 'd' };

    const locations = {
      school: {
        name: 'Школа',
        floor: '#eaf3ff',
        wall: '#b6d4f2',
        objects: [
          {
            npc: 'Учитель',
            x: 180,
            y: 150,
            color: '#2563eb',
            title: 'Досмотр рюкзака',
            text: 'Учитель говорит, что может сам открыть твой рюкзак и проверить личные вещи без объяснения причин.',
            options: [
              { text: 'Спокойно попросить объяснить основание и провести проверку с соблюдением прав ученика.', correct: true, xp: 15, law: 'Правильно. Закон РК «Об образовании» закрепляет уважение чести и достоинства обучающихся. Личные вещи нельзя проверять произвольно и унизительно.' },
              { text: 'Убежать и никому ничего не объяснять.', correct: false, xp: -5, law: 'Лучше не конфликтовать. Важно спокойно попросить объяснить причину и обратиться к родителям или администрации.' },
              { text: 'Разрешить любой досмотр, даже если тебе неприятно.', correct: false, xp: -5, law: 'У ученика есть право на уважительное отношение. Согласие под давлением не лучший способ защиты прав.' },
            ],
          },
          {
            npc: 'Одноклассник',
            x: 530,
            y: 240,
            color: '#0f8a5f',
            title: 'Буллинг в чате',
            text: 'Одноклассники пишут оскорбления в общем чате и требуют молчать, иначе станет хуже.',
            options: [
              { text: 'Сохранить скриншоты и обратиться к классному руководителю, родителям или администрации.', correct: true, xp: 15, law: 'Правильно. Школа обязана создавать безопасные условия обучения, а достоинство ученика должно уважаться.' },
              { text: 'Ответить такими же оскорблениями.', correct: false, xp: -5, law: 'Так можно самому стать нарушителем. Доказательства и обращение к взрослым работают надежнее.' },
              { text: 'Удалить чат и забыть.', correct: false, xp: -5, law: 'Без доказательств сложнее остановить травлю. Лучше сохранить переписку.' },
            ],
          },
          {
            npc: 'Администратор',
            x: 760,
            y: 410,
            color: '#9333ea',
            title: 'Не пускают на занятие',
            text: 'Тебя не пускают на урок из-за внешнего вида, хотя угрозы безопасности нет.',
            options: [
              { text: 'Попросить назвать правило школы и предложить обсудить вопрос с родителями и администрацией.', correct: true, xp: 15, law: 'Правильно. Ограничения должны быть понятными, законными и не нарушать право на образование.' },
              { text: 'Сразу устроить скандал в коридоре.', correct: false, xp: -5, law: 'Скандал редко помогает. Лучше просить письменное объяснение и говорить спокойно.' },
              { text: 'Больше не ходить в школу.', correct: false, xp: -5, law: 'Право на образование важно защищать, а не отказываться от него.' },
            ],
          },
        ],
      },
      work: {
        name: 'Работа',
        floor: '#f4f0e8',
        wall: '#d8c6ab',
        objects: [
          {
            npc: 'Работодатель',
            x: 210,
            y: 190,
            color: '#c2410c',
            title: 'Задержка зарплаты',
            text: 'Работодатель говорит: «Денег пока нет, зарплату получишь когда-нибудь потом».',
            options: [
              { text: 'Попросить выплату письменно и зафиксировать задержку.', correct: true, xp: 15, law: 'Правильно. По Трудовому кодексу РК зарплата должна выплачиваться в установленные сроки.' },
              { text: 'Согласиться работать бесплатно еще месяц.', correct: false, xp: -5, law: 'Работа должна оплачиваться. Молчаливое согласие может ухудшить позицию.' },
              { text: 'Забрать имущество компании вместо зарплаты.', correct: false, xp: -10, law: 'Нельзя самовольно забирать чужое имущество. Нужно действовать законными способами.' },
            ],
          },
          {
            npc: 'Менеджер',
            x: 520,
            y: 330,
            color: '#2563eb',
            title: 'Сверхурочная работа',
            text: 'Менеджер требует каждый день оставаться на 3 часа после смены без оплаты.',
            options: [
              { text: 'Уточнить письменное оформление сверхурочной работы и оплату.', correct: true, xp: 15, law: 'Правильно. Трудовой кодекс РК регулирует сверхурочную работу и ее оплату.' },
              { text: 'Всегда оставаться бесплатно, чтобы не спорить.', correct: false, xp: -5, law: 'Сверхурочная работа не должна становиться бесплатной нормой.' },
              { text: 'Просто не выйти на работу без предупреждения.', correct: false, xp: -5, law: 'Лучше фиксировать нарушение и вести переписку, а не создавать новый конфликт.' },
            ],
          },
          {
            npc: 'HR',
            x: 780,
            y: 180,
            color: '#0f8a5f',
            title: 'Испытательный срок',
            text: 'HR говорит, что на испытательном сроке можно не платить зарплату и уволить без объяснений.',
            options: [
              { text: 'Спросить условия трудового договора и оплату за фактически выполненную работу.', correct: true, xp: 15, law: 'Правильно. Испытательный срок не означает бесплатную работу. Условия должны быть оформлены.' },
              { text: 'Работать бесплатно, пока не примут официально.', correct: false, xp: -5, law: 'Бесплатный испытательный срок — риск. Фактическая работа должна иметь понятные условия.' },
              { text: 'Подписать пустой лист для оформления.', correct: false, xp: -10, law: 'Нельзя подписывать пустые или непонятные документы.' },
            ],
          },
        ],
      },
      car: {
        name: 'Вождение машины',
        floor: '#edf2f7',
        wall: '#94a3b8',
        objects: [
          {
            npc: 'Полицейский ДПС',
            x: 200,
            y: 430,
            color: '#1e40af',
            title: 'Остановка автомобиля',
            text: 'Сотрудник ДПС остановил машину и просит документы, но ты не понимаешь причину остановки.',
            options: [
              { text: 'Спокойно передать документы и уточнить причину остановки.', correct: true, xp: 15, law: 'Правильно. Водитель должен соблюдать законные требования, но может уточнить основание проверки.' },
              { text: 'Сразу уехать, потому что торопишься.', correct: false, xp: -10, law: 'Невыполнение законного требования может привести к ответственности по КоАП РК.' },
              { text: 'Начать грубить и спорить.', correct: false, xp: -5, law: 'Грубость ухудшает ситуацию. Лучше говорить спокойно и фиксировать детали.' },
            ],
          },
          {
            npc: 'Инспектор',
            x: 520,
            y: 230,
            color: '#0f8a5f',
            title: 'Досмотр автомобиля',
            text: 'Инспектор хочет открыть багажник и осмотреть автомобиль без объяснения процедуры.',
            options: [
              { text: 'Уточнить основание досмотра и попросить оформить процедуру по правилам.', correct: true, xp: 15, law: 'Правильно. Досмотр должен проводиться по установленной процедуре, с фиксацией и соблюдением прав.' },
              { text: 'Самовольно толкнуть инспектора и закрыть багажник.', correct: false, xp: -10, law: 'Нельзя применять силу. Нужно требовать соблюдения процедуры законно и спокойно.' },
              { text: 'Разрешить все без вопросов, даже если процедура непонятна.', correct: false, xp: -5, law: 'Водитель может уточнять основание и порядок действий.' },
            ],
          },
          {
            npc: 'Камера штрафов',
            x: 780,
            y: 340,
            color: '#c2410c',
            title: 'Штраф за нарушение',
            text: 'Пришел штраф, но ты считаешь, что за рулем был другой человек и есть доказательства.',
            options: [
              { text: 'Проверить постановление, сроки и подать жалобу с доказательствами.', correct: true, xp: 15, law: 'Правильно. По КоАП РК постановления можно обжаловать в установленный срок.' },
              { text: 'Игнорировать штраф навсегда.', correct: false, xp: -5, law: 'Игнорирование может привести к дополнительным проблемам. Лучше проверить порядок обжалования.' },
              { text: 'Удалить сообщение и не открывать документы.', correct: false, xp: -5, law: 'Сроки обжалования важны. Документы лучше изучить сразу.' },
            ],
          },
        ],
      },
    };

    const player = { x: 90, y: 90, size: 28, speed: 250 };
    const state = { mode: 'menu', locationId: null, xp: 0, solved: new Set(), activeCase: null, lastTime: 0 };

    window.addEventListener('keydown', (event) => {
      const key = keyMap[event.key.toLowerCase()];
      if (key) {
        keys[key] = true;
        event.preventDefault();
      }
      if (event.key.toLowerCase() === 'e' || event.key.toLowerCase() === 'у') {
        tryInteract();
      }
    });

    window.addEventListener('keyup', (event) => {
      const key = keyMap[event.key.toLowerCase()];
      if (key) {
        keys[key] = false;
        event.preventDefault();
      }
    });

    document.querySelectorAll('[data-location]').forEach((button) => {
      button.addEventListener('click', () => startLevel(button.dataset.location));
    });

    document.getElementById('backToMenu').addEventListener('click', showMenu);
    document.getElementById('modalMenu').addEventListener('click', showMenu);
    document.getElementById('continueGame').addEventListener('click', closeModal);

    function startLevel(locationId) {
      state.locationId = locationId;
      state.mode = 'game';
      state.xp = 0;
      state.solved = new Set();
      player.x = 90;
      player.y = 90;
      menu.style.display = 'none';
      gameUi.style.display = 'block';
      updateHud();
    }

    function showMenu() {
      state.mode = 'menu';
      modalBackdrop.style.display = 'none';
      gameUi.style.display = 'none';
      menu.style.display = 'grid';
      Object.keys(keys).forEach((key) => keys[key] = false);
    }

    function updateHud() {
      const level = locations[state.locationId];
      locationName.textContent = level ? level.name : 'Локация';
      xpView.textContent = `XP: ${state.xp}`;
      solvedView.textContent = `Решено: ${state.solved.size}/3`;
    }

    function update(delta) {
      if (state.mode !== 'game') return;

      let dx = 0;
      let dy = 0;
      if (keys.w) dy -= 1;
      if (keys.s) dy += 1;
      if (keys.a) dx -= 1;
      if (keys.d) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const length = Math.hypot(dx, dy);
        const step = player.speed * delta;
        player.x += (dx / length) * step;
        player.y += (dy / length) * step;
      }

      player.x = clamp(player.x, 28, canvas.width - player.size - 28);
      player.y = clamp(player.y, 28, canvas.height - player.size - 28);
    }

    function draw() {
      const level = locations[state.locationId] || locations.school;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawMap(level);
      drawObjects(level);
      drawPlayer();
    }

    function drawMap(level) {
      ctx.fillStyle = level.floor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = level.wall;
      ctx.lineWidth = 24;
      ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);

      ctx.strokeStyle = 'rgba(15, 23, 42, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 80; x < canvas.width; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, 24);
        ctx.lineTo(x, canvas.height - 24);
        ctx.stroke();
      }
      for (let y = 80; y < canvas.height; y += 80) {
        ctx.beginPath();
        ctx.moveTo(24, y);
        ctx.lineTo(canvas.width - 24, y);
        ctx.stroke();
      }
    }

    function drawObjects(level) {
      level.objects.forEach((item, index) => {
        const isSolved = state.solved.has(index);
        const near = getDistance(player, item) < 80;

        ctx.fillStyle = isSolved ? '#94a3b8' : item.color;
        ctx.beginPath();
        ctx.roundRect(item.x, item.y, 54, 54, 8);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = '700 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(isSolved ? '✓' : '!', item.x + 27, item.y + 34);

        ctx.fillStyle = near ? '#111827' : '#475569';
        ctx.font = '700 16px sans-serif';
        ctx.fillText(item.npc, item.x + 27, item.y - 10);

        if (near && !isSolved) {
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#2563eb';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(item.x - 18, item.y + 64, 90, 30, 8);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#2563eb';
          ctx.font = '800 14px sans-serif';
          ctx.fillText('Нажми E', item.x + 27, item.y + 84);
        }
      });
    }

    function drawPlayer() {
      ctx.fillStyle = '#111827';
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.size, player.size, 6);
      ctx.fill();
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(player.x + 7, player.y + 7, 14, 6);
    }

    function tryInteract() {
      if (state.mode !== 'game') return;
      const level = locations[state.locationId];
      const index = level.objects.findIndex((item, objectIndex) => {
        return !state.solved.has(objectIndex) && getDistance(player, item) < 90;
      });

      if (index === -1) return;
      openCase(level.objects[index], index);
    }

    function openCase(item, index) {
      state.mode = 'dialog';
      state.activeCase = { item, index, answered: false };
      npcName.textContent = item.npc;
      caseTitle.textContent = item.title;
      caseText.textContent = item.text;
      feedback.className = 'feedback';
      feedback.textContent = '';
      answers.innerHTML = '';

      item.options.forEach((option) => {
        const button = document.createElement('button');
        button.className = 'answer';
        button.textContent = option.text;
        button.addEventListener('click', () => chooseAnswer(option));
        answers.appendChild(button);
      });

      modalBackdrop.style.display = 'grid';
    }

    function chooseAnswer(option) {
      if (!state.activeCase || state.activeCase.answered) return;
      state.activeCase.answered = true;
      state.xp += option.xp;
      state.solved.add(state.activeCase.index);
      feedback.className = option.correct ? 'feedback good' : 'feedback bad';
      feedback.textContent = `${option.correct ? '+15 XP' : `${option.xp} XP`} · ${option.law}`;
      updateHud();
    }

    function closeModal() {
      modalBackdrop.style.display = 'none';
      state.activeCase = null;
      state.mode = 'game';
    }

    function getDistance(a, b) {
      const ax = a.x + player.size / 2;
      const ay = a.y + player.size / 2;
      const bx = b.x + 27;
      const by = b.y + 27;
      return Math.hypot(ax - bx, ay - by);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function loop(time) {
      const delta = Math.min((time - state.lastTime) / 1000 || 0, 0.04);
      state.lastTime = time;
      update(delta);
      if (state.mode !== 'menu') draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
